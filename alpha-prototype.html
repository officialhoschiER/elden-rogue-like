<meta charset="utf-8">
<title>ELDEN ROGUE — Alpha 0.1</title>
<style>
  :root { --bg:#0d0d0d; --fg:#d8c690; --dim:#7a6f4a; --acc:#c8a24b; --red:#a33; --grn:#5a7d3a; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
    font-family:"Courier New",monospace; font-size:16px; line-height:1.5; }
  #wrap { max-width:720px; margin:0 auto; padding:24px 18px 60px; }
  h1 { font-size:22px; letter-spacing:3px; color:var(--acc); margin:0 0 2px; }
  .ver { color:var(--dim); font-size:12px; letter-spacing:2px; margin-bottom:18px; }
  hr { border:0; border-top:1px dashed var(--dim); margin:14px 0; }
  .bar { color:var(--dim); font-size:13px; }
  .stat { color:var(--acc); }
  button { font-family:inherit; font-size:15px; background:#151510; color:var(--fg);
    border:1px solid var(--dim); padding:7px 12px; margin:4px 6px 4px 0; cursor:pointer; }
  button:hover { border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.35; cursor:default; }
  #log { white-space:pre-wrap; min-height:120px; margin-top:8px; }
  .en { color:var(--red); } .hl { color:#fff; } .sf { color:var(--grn); }
  .node { display:inline-block; width:26px; text-align:center; }
  .cur { color:var(--acc); }
  .done { color:var(--dim); }
  .pre { color:var(--fg); }
</style>

<div id="wrap">
  <h1>ELDEN ROGUE</h1>
  <div class="ver">ALPHA 0.1 &nbsp;·&nbsp; prototype build</div>
  <div id="top" class="bar"></div>
  <hr>
  <div id="scene"></div>
  <div id="buttons"></div>
  <div id="log"></div>
</div>

<script>
// ---- ganz simpler Prototyp: Klasse -> Knoten fuer Knoten -> Boss ----
const KLASSEN = {
  "Vagabund":  { hp:120, dmg:14, dodge:0.10, heal:3 },
  "Krieger":   { hp:100, dmg:18, dodge:0.15, heal:2 },
  "Prophet":   { hp: 90, dmg:12, dodge:0.20, heal:4 },
};
const REGIONEN = [
  { name:"Limgrave", boss:"Grafinger Godrick", bhp:220, bdmg:22 },
  { name:"Caelid",   boss:"Sternengeissel Radahn", bhp:340, bdmg:30 },
];

let S = null; // state

function neu() {
  S = { klasse:null, maxhp:0, hp:0, dmg:0, dodge:0, heal:0, flakons:0,
        seelen:0, region:0, knoten:0, feind:null };
  render();
}

function waehle(k) {
  const c = KLASSEN[k];
  S.klasse=k; S.maxhp=c.hp; S.hp=c.hp; S.dmg=c.dmg; S.dodge=c.dodge;
  S.heal=c.heal; S.flakons=3;
  log(`Du erhebst dich als <span class="hl">${k}</span>.`);
  render();
}

const KNOTEN_PRO_REGION = 4; // 3 Gegner + Boss

function spawnFeind() {
  const r = REGIONEN[S.region];
  const istBoss = S.knoten === KNOTEN_PRO_REGION-1;
  if (istBoss) {
    S.feind = { name:r.boss, hp:r.bhp, maxhp:r.bhp, dmg:r.bdmg, boss:true };
    log(`\n<span class="en">⚔ ${r.boss}</span> erscheint!`);
  } else {
    const stufe = S.region*0.4;
    const hp = Math.round((40+S.knoten*12) * (1+stufe));
    S.feind = { name:"Wiedergänger", hp, maxhp:hp,
                dmg:Math.round((10+S.knoten*3)*(1+stufe)), boss:false };
    log(`\nEin <span class="en">${S.feind.name}</span> (${hp} HP) stellt sich dir.`);
  }
  render();
}

function angriff() {
  if (!S.feind) return;
  S.feind.hp -= S.dmg;
  log(`Du triffst ${S.feind.name} für <span class="hl">${S.dmg}</span>.`);
  if (S.feind.hp <= 0) return feindBesiegt();
  gegnerKontert();
}
function heilen() {
  if (S.flakons<=0) return;
  S.flakons--;
  const menge = Math.round(S.maxhp*0.4);
  S.hp = Math.min(S.maxhp, S.hp+menge);
  log(`<span class="sf">Heiltrank</span> (+${menge} HP).`);
  gegnerKontert();
}
function gegnerKontert() {
  if (!S.feind || S.feind.hp<=0) return render();
  if (Math.random() < S.dodge) {
    log(`Du weichst dem Angriff aus! <span class="sf">(ausgewichen)</span>`);
  } else {
    S.hp -= S.feind.dmg;
    log(`<span class="en">${S.feind.name}</span> trifft dich für ${S.feind.dmg}.`);
    if (S.hp<=0) return tod();
  }
  render();
}
function feindBesiegt() {
  const boss = S.feind.boss;
  const seelen = boss ? 200+S.region*150 : 30+S.knoten*10;
  S.seelen += seelen;
  log(`${boss?'<span class="hl">BOSS BESIEGT.</span>':`${S.feind.name} fällt.`} +${seelen} Seelen.`);
  S.feind = null;
  if (boss) {
    S.region++; S.knoten=0;
    if (S.region >= REGIONEN.length) return sieg();
    log(`\n>> Neue Region: <span class="stat">${REGIONEN[S.region].name}</span>`);
  } else {
    S.knoten++;
    S.hp = Math.min(S.maxhp, S.hp + Math.round(S.maxhp*0.15)); // kleine Rast
  }
  render();
}
function tod() {
  S.feind=null;
  render("<span class='en'>DU BIST GESTORBEN.</span>\n\nDeine Seelen sind verloren.");
  document.getElementById("buttons").innerHTML =
    `<button onclick="neu()">Neuer Versuch</button>`;
}
function sieg() {
  render("<span class='hl'>ERDENRING WIEDERHERGESTELLT.</span>\n\nDu wurdest zum Fürsten.");
  document.getElementById("buttons").innerHTML =
    `<button onclick="neu()">Nochmal</button>`;
}

// ---------- Render ----------
function log(t){ const l=document.getElementById("log"); l.innerHTML += (l.innerHTML?"\n":"")+t;
  l.scrollTop = l.scrollHeight; }

function karte() {
  let out = "";
  for (let i=0;i<KNOTEN_PRO_REGION;i++){
    const boss = i===KNOTEN_PRO_REGION-1;
    let cls = "pre", ch = boss ? "☗" : "○";
    if (i < S.knoten) { cls="done"; ch="×"; }
    else if (i === S.knoten) { cls="cur"; ch = boss?"☗":"◉"; }
    out += `<span class="node ${cls}">${ch}</span>`;
    if (i<KNOTEN_PRO_REGION-1) out += `<span class="done">─</span>`;
  }
  return out;
}

function render(sceneOverride) {
  const top = document.getElementById("top");
  const scene = document.getElementById("scene");
  const btns = document.getElementById("buttons");

  if (!S.klasse) {
    top.innerHTML = "Wähle deine Ausgangsklasse.";
    scene.innerHTML = "";
    btns.innerHTML = Object.keys(KLASSEN).map(k=>{
      const c=KLASSEN[k];
      return `<button onclick="waehle('${k}')">${k} <span class="bar">(${c.hp} HP · ${c.dmg} dmg · ${Math.round(c.dodge*100)}% dodge)</span></button>`;
    }).join("");
    document.getElementById("log").innerHTML="";
    return;
  }

  top.innerHTML =
    `<span class="stat">${S.klasse}</span> · HP <span class="hl">${Math.max(0,S.hp)}</span>/${S.maxhp}` +
    ` · 🧪 ${S.flakons} · Seelen <span class="stat">${S.seelen}</span>` +
    ` · Region <span class="stat">${REGIONEN[S.region]?.name||"—"}</span>`;

  if (sceneOverride!==undefined) { scene.innerHTML = sceneOverride; return; }

  scene.innerHTML = karte() + "<br><br>" +
    (S.feind
      ? `<span class="en">${S.feind.name}</span> — HP ${Math.max(0,S.feind.hp)}/${S.feind.maxhp}`
      : `<span class="bar">Reise zum nächsten Knoten…</span>`);

  if (S.feind) {
    btns.innerHTML =
      `<button onclick="angriff()">Angriff</button>` +
      `<button onclick="heilen()" ${S.flakons<=0?"disabled":""}>Heiltrank (${S.flakons})</button>`;
  } else {
    btns.innerHTML = `<button onclick="spawnFeind()">Weiter ▶</button>`;
  }
}

neu();
</script>
